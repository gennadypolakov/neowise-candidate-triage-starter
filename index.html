<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена", other: "Другое" };

    function render(status, topic, draft) {
      if (status === "ready") {
        result.textContent = `Тема: ${TOPIC_LABELS[topic] ?? topic}\n\nЧерновик:\n${draft}`;
      } else if (status === "manual_review") {
        result.textContent = "Не удалось разобрать заявку автоматически — разберите её вручную.";
      } else if (status === "invalid_input") {
        result.textContent = "Введите текст заявки.";
      } else {
        result.textContent = "Ошибка сервера. Попробуйте ещё раз.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.textContent = "";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();
        render(data.status, data.topic, data.draft);
      } catch {
        result.textContent = "Не удалось связаться с сервером.";
      }
    });
  </script>
</body>
</html>
